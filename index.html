<div id="google-gate" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#F1EDE4;font-family:'Be Vietnam Pro',sans-serif">

      <div style="font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:#21303B;margin-bottom:4px">Đăng nhập</div>

        <svg width="18" height="18" viewBox="0 0 48 48" style="flex-shrink:0"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-2.1 14.1-5.5l-6.5-5.5C29.6 34.9 26.9 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.5 5.5C41.9 35.8 44 30.2 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        Đăng nhập bằng Google
      </button>
      <div id="google-gate-error" style="display:none;margin-top:12px;font-size:12px;color:#B3261E"></div>
      <div style="margin-top:18px;font-size:11px;color:#A9A599">🔒 Chỉ dành cho quản trị nhân sự</div>

  <aside id="sidebar" style="display:none">

  <div id="main" style="display:none">

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script>
  // FIREBASE AUTH (bao mat toan bo web - chi brian.pham@bigx.vn)
  const firebaseConfig = {
    apiKey: "AIzaSyBX9fCTBfE0Z7WWtJaZu_n8F4NySn1Dq1U",
    authDomain: "bigx-chamcong-hr.firebaseapp.com",
    databaseURL: "https://bigx-chamcong-hr-default-rtdb.firebaseio.com",
    projectId: "bigx-chamcong-hr",
    storageBucket: "bigx-chamcong-hr.firebasestorage.app",
    messagingSenderId: "576164766996",
    appId: "1:576164766996:web:37dcc1e67b61ac661cce01",
    measurementId: "G-LXK6VD31Q6"
  };
  firebase.initializeApp(firebaseConfig);
  const bxAuth = firebase.auth();
  const BX_ALLOWED_EMAIL = 'brian.pham@bigx.vn';

  window.bxGetIdToken = async function(){
    try{ if (bxAuth.currentUser) return await bxAuth.currentUser.getIdToken(); }catch(e){}
    return null;
  };
  window.bxAuthedFetch = async function(url, opts){
    var token = await window.bxGetIdToken();
    var sep = url.indexOf('?') > -1 ? '&' : '?';
    var finalUrl = token ? (url + sep + 'auth=' + token) : url;
    return fetch(finalUrl, opts);
  };

  bxAuth.onAuthStateChanged(function(user){
    var gate = document.getElementById('google-gate');
    var errEl = document.getElementById('google-gate-error');
    var sb = document.getElementById('sidebar'), mn = document.getElementById('main');
    if (user && user.email === BX_ALLOWED_EMAIL) {
      if (gate) gate.style.display = 'none';
      if (errEl) errEl.style.display = 'none';
      if (sb) sb.style.display = 'flex';
      if (mn) mn.style.display = 'flex';
      // [C] app.js có thể chưa tải xong (VD vừa đổi phiên bản) → đợi tới khi có bxMainBoot rồi mới khởi động, tránh kẹt "Đang tải…"
      if (!window.__bxAppBooted && !window.__bxBootWait) {
        window.__bxBootWait = true;
        (function tryBoot(n){
          if (typeof window.bxMainBoot === 'function') { window.__bxBootWait = false; window.__bxAppBooted = true; window.bxMainBoot(); }
          else if (n < 600) setTimeout(function(){ tryBoot(n+1); }, 50);
          else window.__bxBootWait = false;
        })(0);
      }
    } else {
      if (user) {
        if (errEl) { errEl.textContent = 'Tài khoản ' + user.email + ' không có quyền truy cập trang này.'; errEl.style.display = 'block'; }
        bxAuth.signOut();
      }
      if (sb) sb.style.display = 'none';
      if (mn) mn.style.display = 'none';
      if (gate) gate.style.display = 'flex';
    }
  });

  document.addEventListener('DOMContentLoaded', function(){
    var btn = document.getElementById('google-gate-btn');
    if (btn) btn.addEventListener('click', function(){
      var provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ login_hint: BX_ALLOWED_EMAIL });
      bxAuth.signInWithPopup(provider).catch(function(e){
        var err = document.getElementById('google-gate-error');
        if (err) { err.textContent = 'Đăng nhập thất bại: ' + (e && e.message ? e.message : e); err.style.display = 'block'; }
      });
    });
  });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
  <script src="app.js?v=66"></script>
</body>
