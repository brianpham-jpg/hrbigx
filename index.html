<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BigX HR Analytics Dashboard</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css?v=30">
</head>
<body>

  <aside id="sidebar">
    <div class="sb-head">
      <div class="sb-brand">
        <div class="sb-logo">B</div>
        <div>
          <div class="sb-name">BigX Agency</div>
          <div class="sb-sub">HR Analytics</div>
        </div>
      </div>
    </div>
    <nav id="nav"><!-- render by app.js --></nav>
    <div class="sb-foot">
      <div class="sb-avatar">BP</div>
      <div>
        <div class="sb-uname">Brian Pham</div>
        <div class="sb-urole">HR Specialist</div>
      </div>
    </div>
  </aside>

  <div id="main">
    <div class="topbar">
      <div class="tb-left">
        <div class="tb-icon" id="tb-icon"><i class="ti ti-layout-dashboard"></i></div>
        <div>
          <div class="tb-title" id="tb-title">Bảng điều khiển</div>
          <div class="tb-crumb" id="tb-crumb">Tổng quan</div>
        </div>
      </div>
      <div class="tb-right">
        <span class="tb-note" id="tb-note">Đang tải…</span>
        <span class="tb-tag"><span class="dot"></span>Live</span>
      </div>
    </div>
    <div class="content" id="content"><!-- render by app.js --></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
  <script src="app.js?v=33"></script>
</body>
</html>
